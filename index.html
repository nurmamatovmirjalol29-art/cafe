<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sepki Cafe — Menyu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe0;--panel:#fffaf0;--ink:#1b2433;--mute:#6b6556;--gold:#9c6f12;--gold2:#c9972b;--line:rgba(156,111,18,.35);--btn-ink:#fffaf0;--navy:#0b1c36}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071426;--panel:#0d2038;--ink:#f4ecd8;--mute:#9aa7b8;--gold:#dfb76c;--gold2:#dfb76c;--line:rgba(223,183,108,.3);--btn-ink:#071426}}
:root[data-theme="dark"]{--bg:#071426;--panel:#0d2038;--ink:#f4ecd8;--mute:#9aa7b8;--gold:#dfb76c;--gold2:#dfb76c;--line:rgba(223,183,108,.3);--btn-ink:#071426}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Alegreya,Georgia,serif;padding-bottom:110px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.hero{background:var(--navy);color:#f4ecd8;text-align:center;padding:34px 20px 54px;position:relative;
 border-bottom:3px solid #dfb76c}
.hero svg{display:block;margin:0 auto 10px}
.hero h1{font:400 30px/1.15 Marcellus,Georgia,serif;letter-spacing:.14em;margin:0;color:#dfb76c}
.hero p{margin:6px 0 0;color:#cfd6e0;font-size:16px}
.arch{position:relative;background:var(--navy);height:34px;margin-top:-1px}
.arch:after{content:"";position:absolute;left:0;right:0;top:0;height:34px;background:var(--bg);
 border-radius:50% 50% 0 0/100% 100% 0 0}
nav{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 14px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:5}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:1px solid var(--line);border-radius:999px;padding:8px 18px;min-height:44px}
nav button[aria-pressed="true"]{background:var(--gold2);border-color:var(--gold2);color:var(--btn-ink);font-weight:700}
main{max-width:640px;margin:0 auto;padding:0 18px}
h2{font:400 22px Marcellus,Georgia,serif;color:var(--gold);margin:26px 0 4px;display:flex;align-items:center;gap:12px}
h2:after{content:"";flex:1;border-top:1px solid var(--line)}
.dish{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:14px 0;border-bottom:1px dashed var(--line)}
.dish h3{margin:0;font:700 19px Alegreya,Georgia,serif}
.dish p{margin:0;color:var(--mute);font-size:15.5px;grid-column:1}
.price{font-weight:700;color:var(--gold);white-space:nowrap;grid-column:1;margin-top:4px}
.ctl{grid-column:2;grid-row:1/4;align-self:center;display:flex;align-items:center;gap:6px}
.add{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--gold2);background:none;color:var(--gold);font-size:24px;line-height:1}
.add:active{background:var(--gold2);color:var(--btn-ink)}
.qty{display:flex;align-items:center;border:1.5px solid var(--gold2);border-radius:999px;overflow:hidden}
.qty button{background:none;border:0;width:40px;height:44px;font-size:22px;color:var(--gold)}
.qty b{min-width:22px;text-align:center}
.bar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:var(--navy);color:#f4ecd8;border:1px solid #dfb76c;border-radius:999px;padding:10px 10px 10px 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 28px rgba(0,0,0,.35);transform:translateY(160%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);z-index:20}
.bar.show{transform:none}
.bar small{display:block;color:#aab6c6;font-size:13px;line-height:1.2}
.bar strong{font-size:19px;color:#dfb76c}
.go{background:#dfb76c;color:#0b1c36;border:0;border-radius:999px;padding:12px 22px;font-weight:700;min-height:46px}
.sheet{position:fixed;inset:0;background:rgba(3,8,16,.6);display:none;align-items:flex-end;z-index:30}
.sheet.open{display:flex}
.card{background:var(--panel);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;border-top:3px solid var(--gold2)}
.card h2{margin-top:0}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.sum{display:flex;justify-content:space-between;font-weight:700;font-size:19px;margin:14px 0}
label{display:block;color:var(--mute);font-size:15px;margin-top:12px}
input,select{width:100%;margin-top:4px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.acts{display:flex;gap:10px;margin-top:16px}
.acts button{flex:1;min-height:48px;border-radius:999px;border:1.5px solid var(--gold2);background:none;font-weight:700}
.acts .main{background:var(--gold2);color:var(--btn-ink)}
.toast{margin-top:12px;color:var(--gold);min-height:1.4em}
.calls{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}.calls a{color:#0b1c36;background:#dfb76c;text-decoration:none;font-weight:700;border-radius:999px;padding:11px 20px;min-height:44px}
.off h3,.off p,.off .price{opacity:.45}.out{color:var(--mute);border:1px dashed var(--line);border-radius:999px;padding:8px 14px;font-size:15px}
.tm{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;background:none;border:1px solid rgba(223,183,108,.5);color:#dfb76c;border-radius:999px;width:40px;height:40px}
@media (prefers-reduced-motion:reduce){.bar{transition:none}}
</style>
</head>
<body>
<header class="hero">
  <button class="tm" id="tm" aria-label="Rejimni almashtirish">◐</button>
  <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#dfb76c" stroke-width="1.5" aria-hidden="true">
    <path d="M32 3 38 18 54 10 46 26 61 32 46 38 54 54 38 46 32 61 26 46 10 54 18 38 3 32 18 26 10 10 26 18Z"/>
    <circle cx="32" cy="32" r="9"/><circle cx="32" cy="32" r="3" fill="#dfb76c"/>
  </svg>
  <h1>SEPKI CAFE</h1>
  <p>Nurobod tumani, Buloqboshi MFY</p>
  <p>Har kuni 9:00 dan 21:00 gacha</p>
  <div class="calls"><a href="tel:+998915269562">91 526 95 62</a><a href="tel:+998994709562">99 470 95 62</a></div>
</header>
<div class="arch" aria-hidden="true"></div>
<nav id="tabs" aria-label="Toifalar"></nav>
<main id="menu" aria-live="polite"></main>

<div class="bar" id="bar">
  <div><small id="cnt"></small><strong id="tot"></strong></div>
  <button class="go" id="open">Buyurtma berish</button>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Buyurtmangiz">
  <div class="card">
    <h2>Buyurtmangiz</h2>
    <div id="lines"></div>
    <div class="sum" id="sumrow"><span>Jami</span><span id="sum"></span></div>
    <label>Qanday olasiz?<select id="how"><option>Joyida yeyman</option><option>Olib ketaman</option></select></label>
    <label>Ismingiz yoki stol raqami<input id="who" placeholder="Masalan: Aziz yoki 3-stol"></label>
    <div class="acts">
      <button id="back">Menyuga qaytish</button>
      <button class="main" id="send">Yuborish</button>
    </div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
const CATS=[["all","Barchasi"],["mangal","Mangal va tandir"],["issiq","Osh va sho'rva"],["xamir","Somsa va lavash"]];
/* Narxlarni shu yerda yozing: price:0 bo'lsa narx ko'rinmaydi */
const FALLBACK=[
{id:1,name:"Shashlik",desc:"Mangalda pishirilgan",price:0,category:"mangal"},
{id:2,name:"Tandir",desc:"Tandirda pishirilgan go'sht",price:0,category:"mangal"},
{id:3,name:"Grel",desc:"Qizdirilgan, sershira",price:0,category:"mangal"},
{id:4,name:"Osh",desc:"Qozonda damlangan palov",price:0,category:"issiq"},
{id:5,name:"Sho'rva",desc:"Issiq, to'yimli sho'rva",price:0,category:"issiq"},
{id:6,name:"Somsa",desc:"Tandirdan yangi uzilgan",price:0,category:"xamir"},
{id:7,name:"Lavash",desc:"Yumshoq non ichida go'sht va sabzavot",price:0,category:"xamir"}];
const fmt=n=>n?Number(n).toLocaleString("uz-UZ").replace(/\u00a0/g," ")+" so'm":"";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let foods=[],cat="all",cart={};

async function load(first){
  try{const r=await fetch("/api/menu",{cache:"no-store"});if(!r.ok)throw 0;foods=await r.json();}
  catch(e){if(first)foods=FALLBACK;else return;}
  for(const id in cart){const f=foods.find(x=>x.id==id);if(!f||f.available===false)delete cart[id];}
  if(first)tabs();render();bar();
}
function tabs(){
  const t=document.getElementById("tabs");
  t.innerHTML=CATS.map(([k,l])=>`<button data-c="${k}" aria-pressed="${k===cat}">${l}</button>`).join("");
  t.onclick=e=>{const b=e.target.closest("button");if(!b)return;cat=b.dataset.c;tabs();render();};
}
function ctl(id){
  const fd=foods.find(x=>x.id===id);
  if(fd&&fd.available===false)return '<span class="out">Tugagan</span>';
  const q=cart[id]?cart[id].qty:0;
  return q?`<div class="qty"><button data-a="dec" data-id="${id}" aria-label="Kamaytirish">−</button><b>${q}</b><button data-a="inc" data-id="${id}" aria-label="Ko'paytirish">+</button></div>`
          :`<button class="add" data-a="inc" data-id="${id}" aria-label="Savatchaga qo'shish">+</button>`;
}
function render(){
  const m=document.getElementById("menu");
  const list=foods.filter(f=>cat==="all"||f.category===cat);
  if(!list.length){m.innerHTML='<p style="color:var(--mute);padding:24px 0">Bu toifada hozircha taom yo\'q.</p>';return;}
  const names={mangal:"Mangal va tandir",issiq:"Osh va sho'rva",xamir:"Somsa va lavash"};
  let html="",last="";
  list.forEach(f=>{
    if(f.category!==last){last=f.category;html+=`<h2>${names[f.category]||esc(f.category)}</h2>`;}
    html+=`<div class="dish${f.available===false?" off":""}"><h3>${esc(f.name)}</h3><div class="ctl" id="c${f.id}">${ctl(f.id)}</div><p>${esc(f.desc)}</p><span class="price">${fmt(f.price)}</span></div>`;
  });
  m.innerHTML=html;
}
document.getElementById("menu").onclick=e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const id=+b.dataset.id,f=foods.find(x=>x.id===id);
  if(b.dataset.a==="inc"){cart[id]=cart[id]||{name:f.name,price:f.price,qty:0};cart[id].qty++;}
  else if(cart[id]&&--cart[id].qty<=0)delete cart[id];
  document.getElementById("c"+id).innerHTML=ctl(id);
  bar();
};
function totals(){let t=0,c=0;for(const k in cart){t+=cart[k].price*cart[k].qty;c+=cart[k].qty;}return{t,c};}
function bar(){
  const{t,c}=totals(),b=document.getElementById("bar");
  document.getElementById("cnt").textContent=c+" ta taom";
  document.getElementById("tot").textContent=fmt(t);
  b.classList.toggle("show",c>0);
}
const sheet=document.getElementById("sheet");
function lines(){
  document.getElementById("lines").innerHTML=Object.values(cart).map(i=>`<div class="row"><span>${esc(i.name)} × ${i.qty}</span><span>${fmt(i.price*i.qty)}</span></div>`).join("");
  document.getElementById("sum").textContent=fmt(totals().t);document.getElementById("sumrow").style.display=totals().t?"flex":"none";
}
document.getElementById("open").onclick=()=>{lines();document.getElementById("toast").textContent="";sheet.classList.add("open");};
document.getElementById("back").onclick=()=>sheet.classList.remove("open");
sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove("open");};
document.addEventListener("keydown",e=>{if(e.key==="Escape")sheet.classList.remove("open");});
document.getElementById("send").onclick=async()=>{
  const who=document.getElementById("who").value.trim()||"Mijoz";
  const how=document.getElementById("how").value;
  const items=Object.values(cart).map(i=>({name:i.name,qty:i.qty,price:i.price}));
  const total=totals().t;
  const toast=document.getElementById("toast");
  toast.textContent="Yuborilmoqda...";
  
  try{
    const r=await fetch("/api/order",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({who,how,items,total})
    });
    if(!r.ok)throw 0;
    toast.textContent="✅ Buyurtmangiz qabul qilindi! Tez orada aloqaga chiqamiz.";
    cart={};bar();render();
    setTimeout(()=>sheet.classList.remove("open"),3500);
  }catch(e){
    toast.textContent="❌ Xatolik yuz berdi. Iltimos, qo'ng'iroq qiling: 91 526 95 62";
  }
};
document.getElementById("tm").onclick=()=>{
  const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()==="#071426";
  r.dataset.theme=d?"light":"dark";
};
load(true);setInterval(()=>load(false),30000);
</script>
</body>
</html>
